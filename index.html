<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Harrison Keen — Actor. Vancouver based. Internationally cast.">
  <title>Harrison Keen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #1a0533 0%, #0d1a3a 60%, #0a0a14 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      position: relative;
      overflow: hidden;
    }
    .hero-glow-1 {
      position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
      width: 500px; height: 500px;
      background: rgba(236, 72, 153, 0.12);
      border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 1;
    }
    .hero-glow-2 {
      position: absolute; bottom: -60px; right: 10%;
      width: 300px; height: 300px;
      background: rgba(139, 92, 246, 0.15);
      border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 1;
    }
    .hero-photo {
      width: 140px; height: 140px;
      border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(192, 132, 252, 0.5);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
      margin-bottom: 20px;
      position: relative; z-index: 1;
    }
    .hero-photo img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
    }
    .hero-name {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 10px;
      position: relative; z-index: 1;
      background: linear-gradient(90deg, #ffffff, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-tagline {
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 1px;
      margin-bottom: 32px;
      position: relative; z-index: 1;
    }
    .hero-buttons {
      display: flex; gap: 12px; flex-wrap: wrap;
      justify-content: center; align-items: center;
      position: relative; z-index: 1;
    }
    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff; padding: 12px 28px;
      font-size: 13px; font-weight: 700;
      border-radius: 30px; text-decoration: none;
    }
    .btn-secondary {
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #c084fc; padding: 12px 28px;
      font-size: 13px; font-weight: 600;
      border-radius: 30px; text-decoration: none;
    }
    .btn-primary:hover, .btn-primary:focus { opacity: 0.9; outline: none; }
    .btn-secondary:hover, .btn-secondary:focus {
      border-color: rgba(192, 132, 252, 0.8);
      color: #ffffff; outline: none;
    }
    #hw-cursor {
      display: inline-block;
      color: #c084fc;
      animation: hw-blink 1s step-end infinite;
      margin-left: 1px;
    }
    .hero-contact {
      position: absolute;
      left: 0; right: 0; bottom: 28px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      z-index: 11;
      font-size: 12px; letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.45);
    }
    .hero-contact a { color: rgba(255, 255, 255, 0.55); display: flex; }
    .hero-contact a:hover, .hero-contact a:focus { color: #c084fc; outline: none; }
    @keyframes hw-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

  </style>
</head>
<body>
  <!-- HERO -->
  <section class="hero">
    <canvas id="particle-canvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:0;"></canvas>
    <div class="hero-glow-1"></div>
    <div class="hero-glow-2"></div>
    <div class="hero-photo">
      <img src="HARRISON.jpeg" alt="Harrison Keen" />
    </div>
    <div class="hero-name">Harrison Keen</div>
    <p class="hero-tagline"><span id="hw-text"></span><span id="hw-cursor">|</span></p>
    <div class="hero-buttons">
      <a href="/acting" class="btn-primary">Actor</a>
    </div>
    <div class="hero-contact">
      <a href="https://www.instagram.com/harrison.keen/" target="_blank" rel="noopener" aria-label="Instagram @harrison.keen"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>
      <span>keen_ha@outlook.com</span>
    </div>
    <canvas id="star-canvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none;"></canvas>
  </section>

  <script>
    (function () {
      var hero = document.querySelector('.hero');

      /* ── Particle Field ── */
      var pCanvas = document.getElementById('particle-canvas');
      var pCtx = pCanvas.getContext('2d');
      var particles = [];
      var pMouse = { x: -9999, y: -9999 };

      function spawnParticles() {
        var count = Math.round((pCanvas.width * pCanvas.height) / 4500);
        var colors = ['#8b5cf6', '#c084fc', '#ec4899'];
        particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * pCanvas.width,
            y: Math.random() * pCanvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 1.5 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            opacity: 0.4 + Math.random() * 0.2
          });
        }
      }

      function animateParticles() {
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        var i, j, p, dx, dy, d, f, spd;

        for (i = 0; i < particles.length; i++) {
          p = particles[i];
          dx = p.x - pMouse.x;
          dy = p.y - pMouse.y;
          d = Math.sqrt(dx * dx + dy * dy);
          if (d < 90 && d > 0) {
            f = (90 - d) / 90 * 0.8;
            p.vx += (dx / d) * f;
            p.vy += (dy / d) * f;
          }
          p.vx *= 0.97;
          p.vy *= 0.97;
          spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (spd > 2) { p.vx = p.vx / spd * 2; p.vy = p.vy / spd * 2; }
          p.x = (p.x + p.vx + pCanvas.width) % pCanvas.width;
          p.y = (p.y + p.vy + pCanvas.height) % pCanvas.height;
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          pCtx.globalAlpha = p.opacity;
          pCtx.fillStyle = p.color;
          pCtx.fill();
        }
        pCtx.globalAlpha = 1;

        for (i = 0; i < particles.length; i++) {
          for (j = i + 1; j < particles.length; j++) {
            dx = particles[i].x - particles[j].x;
            dy = particles[i].y - particles[j].y;
            d = Math.sqrt(dx * dx + dy * dy);
            if (d < 100) {
              pCtx.beginPath();
              pCtx.strokeStyle = 'rgba(192, 132, 252, ' + ((1 - d / 100) * 0.15) + ')';
              pCtx.lineWidth = 1;
              pCtx.moveTo(particles[i].x, particles[i].y);
              pCtx.lineTo(particles[j].x, particles[j].y);
              pCtx.stroke();
            }
          }
        }

        requestAnimationFrame(animateParticles);
      }

      /* ── Typewriter ── */
      var phrases = [
        'Actor', 'Software Developer', 'Innovator', 'AI Builder',
        'Filmmaker', 'Tech Enthusiast', 'Highly Delusional',
        "Thinks He's A Comedian", 'Sometimes An Idiot', ':)'
      ];
      var hwText = document.getElementById('hw-text');
      var pIdx = 0, cIdx = 0, deleting = false;

      function tick() {
        var word = phrases[pIdx];
        if (!deleting) {
          cIdx++;
          hwText.textContent = word.slice(0, cIdx);
          if (cIdx === word.length) { deleting = true; setTimeout(tick, 1400); return; }
          setTimeout(tick, 65);
        } else {
          cIdx--;
          hwText.textContent = word.slice(0, cIdx);
          if (cIdx === 0) {
            deleting = false;
            pIdx = (pIdx + 1) % phrases.length;
            setTimeout(tick, 300);
            return;
          }
          setTimeout(tick, 35);
        }
      }

      /* ── Star Cursor ── */
      var sCanvas = document.getElementById('star-canvas');
      var sCtx = sCanvas.getContext('2d');
      var trail = [];
      var TRAIL_LEN = 28;
      var starPos = null;
      var rafId = null;
      var lastMoveTime = 0;

      function renderStar() {
        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
        if (!starPos) { rafId = null; return; }
        var idle = Date.now() - lastMoveTime;
        var trailOpacity = idle < 120 ? 1 : Math.max(0, 1 - (idle - 120) / 400);
        if (trailOpacity > 0 && trail.length > 1) {
          var PASSES = 12, p, frac, startIdx, alpha, k;
          sCtx.lineCap = 'round';
          sCtx.lineJoin = 'round';
          for (p = 0; p < PASSES; p++) {
            frac = (p + 1) / PASSES;
            /* pink (#ec4899) at the tip fading to purple (#c084fc) along the tail */
            sCtx.strokeStyle = 'rgb(' + Math.round(236 - 44 * frac) + ', ' +
              Math.round(72 + 60 * frac) + ', ' + Math.round(153 + 99 * frac) + ')';
            startIdx = Math.floor((1 - frac) * (trail.length - 1));
            alpha = (1 - frac) * 0.9 * trailOpacity;
            if (alpha < 0.01 || startIdx >= trail.length - 1) continue;
            sCtx.globalAlpha = alpha;
            sCtx.lineWidth = 0.5 + (1 - frac) * 3;
            sCtx.beginPath();
            sCtx.moveTo(trail[startIdx].x, trail[startIdx].y);
            for (k = startIdx + 1; k < trail.length; k++) {
              sCtx.lineTo(trail[k].x, trail[k].y);
            }
            sCtx.stroke();
          }
          sCtx.globalAlpha = 1;
        }
        rafId = requestAnimationFrame(renderStar);
      }

      /* ── Shared event handlers ── */
      hero.addEventListener('mousemove', function (e) {
        var rect = hero.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        pMouse.x = x;
        pMouse.y = y;
        starPos = { x: x, y: y };
        lastMoveTime = Date.now();
        trail.push({ x: x + 6, y: y + 12 });
        if (trail.length > TRAIL_LEN) trail.shift();
        if (!rafId) rafId = requestAnimationFrame(renderStar);
      });

      hero.addEventListener('mouseenter', function () {
        if (!rafId) rafId = requestAnimationFrame(renderStar);
      });

      hero.addEventListener('mouseleave', function () {
        pMouse.x = -9999;
        pMouse.y = -9999;
        starPos = null;
        trail = [];
        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      });

      /* ── Resize both canvases ── */
      function onResize() {
        pCanvas.width = hero.offsetWidth;
        pCanvas.height = hero.offsetHeight;
        spawnParticles();
        sCanvas.width = hero.offsetWidth;
        sCanvas.height = hero.offsetHeight;
      }

      window.addEventListener('resize', onResize);
      onResize();
      animateParticles();
      setTimeout(tick, 600);
    })();
  </script>
</body>
</html>
