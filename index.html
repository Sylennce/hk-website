<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1b1024;color:#fff;font-family:Cinzel,Georgia,serif;overflow:hidden}
a{color:inherit;text-decoration:none}
.scene{position:relative;height:var(--screen,100svh);overflow:hidden;--gold:255,196,92;--teal:92,236,226;--ink:#3b1247;--ink2:#7c1d5c;--halo:255,246,236}
.stage{position:absolute;left:50%;top:0;width:max(100vw,calc(var(--screen,100svh)*var(--ratio,1.642)));aspect-ratio:var(--ratio,1.642);
  transform:translate(calc(-50% + var(--pan,0px)),var(--lift,0px)) scale(var(--zoom,1));transform-origin:var(--ox,50%) var(--oy,50%)}
/* the walk-in: transform only (no blur/brightness filter: those re-render the whole scene every frame and soften it),
   on its own GPU layer, and a shorter push so the painting is never magnified far enough to look soft before the flash covers it */
.stage{will-change:transform;backface-visibility:hidden}
.stage.walk{transition:transform 1s cubic-bezier(.5,0,.25,1)}
.stage>img,.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{opacity:0;transition:opacity .4s}#gl.ready{opacity:1}
.fx,.signs{position:absolute;inset:0;transform:scale(1.0417);pointer-events:none}
.fx>*,.lay>*{position:absolute}
.lay{inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.lay canvas,#motes{inset:0;width:100%;height:100%}
#farc{z-index:2}
/* painted cast */
.actor{left:0;top:0;width:0;height:0;will-change:transform}
.actor img{position:absolute;bottom:0;left:0;height:100%;transform:translateX(-50%);display:block;-webkit-user-drag:none}
.boat .refl{top:100%;bottom:auto;transform:translateX(-50%) scaleY(-.8);transform-origin:50% 0;opacity:.3;filter:blur(.6px);-webkit-mask-image:linear-gradient(0deg,#000,transparent 85%);mask-image:linear-gradient(0deg,#000,transparent 85%)}
.bfly{left:0;top:0;width:0;height:0}
.bfly b{position:absolute;left:0;top:0;display:block;perspective:200px}
.bfly i{position:absolute;top:-50%;width:50%;height:100%;background-size:200% 100%;background-repeat:no-repeat;animation:flap .2s ease-in-out infinite alternate}
.bfly b{width:calc(var(--s)*1.3);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)*-.65)}
.bfly i{top:0}
.bfly i.a{left:0;background-position:0 0;transform-origin:100% 50%;--f:72deg}
.bfly i.b{left:50%;background-position:100% 0;transform-origin:0 50%;--f:-72deg}
@keyframes flap{from{transform:rotateY(0)}to{transform:rotateY(var(--f))}}
/* lights at the end of each path */
.bloom{width:30%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.7);border-radius:50%;mix-blend-mode:screen;opacity:.16;transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.3,1);animation:idle 5s ease-in-out infinite alternate}
.bloom.l{background:radial-gradient(circle,rgba(var(--gold),.95),rgba(var(--gold),.35) 35%,transparent 66%)}
.bloom.r{background:radial-gradient(circle,rgba(var(--teal),.9),rgba(var(--teal),.32) 35%,transparent 66%);animation-delay:-2.5s}
@keyframes idle{to{opacity:.3}}
.hl .bloom.l,.hr .bloom.r{opacity:.95;transform:translate(-50%,-50%) scale(1);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.12)}}
.beam{width:7%;height:60%;margin-left:-3.5%;transform-origin:50% 100%;translate:0 -100%;clip-path:polygon(50% 100%,0 0,100% 0);
  background:linear-gradient(0deg,rgba(255,240,200,.85),rgba(255,236,190,0) 82%);filter:blur(6px);mix-blend-mode:screen;opacity:.22;transition:opacity .5s}
.beam.a{rotate:-20deg;animation:sweepA 4.6s ease-in-out infinite alternate}
.beam.b{rotate:18deg;animation:sweepB 5.8s ease-in-out infinite alternate}
@keyframes sweepA{to{rotate:9deg}}@keyframes sweepB{to{rotate:-12deg}}
.hl .beam.a,.hl .beam.b{opacity:.6}
.beam.t{width:9%;margin-left:-4.5%;height:70%;background:linear-gradient(0deg,rgba(160,255,246,.9),rgba(120,250,240,0) 85%);rotate:-72deg;opacity:.3;animation:lamp 9s ease-in-out infinite alternate}
@keyframes lamp{to{rotate:72deg}}
.hr .beam.t{opacity:.7}
svg.trail{inset:0;width:100%;height:100%;mix-blend-mode:screen;overflow:visible}
.trail path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease-in}
.trail .glow{stroke-width:3;filter:blur(9px);opacity:.55}
.trail .core{stroke-width:.8;filter:blur(2.5px);opacity:.6}
.trail .l{stroke:rgb(var(--gold))}.trail .r{stroke:rgb(var(--teal))}
.hl .trail .l,.hr .trail .r{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.6,.3,1)}
.dim{inset:0;opacity:0;transition:opacity .6s}
.dim.l{background:linear-gradient(90deg,rgba(40,14,60,.5),rgba(40,14,60,.4) 34%,transparent 52%)}
.dim.r{background:linear-gradient(270deg,rgba(40,14,60,.5),rgba(40,14,60,.4) 34%,transparent 52%)}
.hr .dim.l,.hl .dim.r{opacity:1}
.dawn{position:absolute;inset:0;background:#2a1136;opacity:0;pointer-events:none;animation:dawn 1.2s .05s cubic-bezier(.4,0,.2,1) backwards;z-index:5}
@keyframes dawn{from{opacity:.96}}
/* as you walk in, the whole screen fades from clear to the colour of the path you chose, over the same second as the zoom.
   It is the hover glow carried to its end: brightest at the building (--fx/--fy, set on click), deepening toward the edges. */
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:6;will-change:opacity}
.go-l .flash,.go-r .flash{opacity:1;transition:opacity .95s cubic-bezier(.3,0,.8,.8)}
.go-l .flash{background:radial-gradient(circle at var(--fx,25%) var(--fy,50%),#fff6d8 0,rgb(var(--gold)) 30%,#f3aa34 65%,#d98a1c 100%)}
.go-r .flash{background:radial-gradient(circle at var(--fx,75%) var(--fy,50%),#ecfffd 0,rgb(var(--teal)) 30%,#30cbcf 65%,#1aa3b4 100%)}
/* where you can click */
.way{position:absolute;outline:0;z-index:2;cursor:pointer}
.signs{z-index:3}
/* floating words above the buildings: a gold marquee for the theatre, a hologram window for the observatory */
.signs{container-type:size}
.word{position:absolute;width:0;height:0;pointer-events:auto;cursor:pointer;outline:0;white-space:nowrap}
.word>span{display:block;position:absolute;left:0;top:0;translate:-50% -50%;animation:hover-bob 4.6s ease-in-out infinite alternate;transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .35s}
.word.r>span{animation-delay:-2.3s}
@keyframes hover-bob{from{translate:-50% calc(-50% - .35cqw)}to{translate:-50% calc(-50% + .35cqw)}}
.word:hover>span,.word:focus-visible>span,.hl .word.l>span,.hr .word.r>span{transform:scale(1.1)}
.word.l b{display:block;font:900 3.1cqw/1 Cinzel,serif;letter-spacing:.1em;text-indent:.1em;text-transform:uppercase;
  background:linear-gradient(#fffbe0 8%,#ffd76a 42%,#f0a22e 64%,#b9661a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .06em 0 #6b1420) drop-shadow(0 0 .08em #6b1420) drop-shadow(0 0 .45em rgba(255,190,80,.75))}
.word.l i{display:block;height:.55cqw;margin:.5cqw .35cqw 0;background:radial-gradient(circle,#fff6cf 0 28%,#ffc04a 34% 46%,transparent 52%) 0 50%/1.1cqw 100% space;
  filter:drop-shadow(0 0 .3cqw rgba(255,196,92,.95));animation:bulbs 1.1s steps(2,jump-none) infinite}
.word.l i:first-child{margin:0 .35cqw .5cqw;animation-delay:-.55s}
@keyframes bulbs{from{opacity:.55}to{opacity:1}}
.word.l:hover>span,.word.l:focus-visible>span,.hl .word.l>span{filter:brightness(1.18) drop-shadow(0 0 1cqw rgba(255,200,90,.8))}
.word.r>span{padding:1.25cqw .9cqw .55cqw;border:.13cqw solid rgba(150,255,246,.9);border-radius:.45cqw;
  background:linear-gradient(rgba(120,250,240,.5) 0 .8cqw,rgba(40,170,170,.2) .8cqw),repeating-linear-gradient(0deg,rgba(160,255,248,.1) 0 .12cqw,transparent .12cqw .3cqw);
  box-shadow:0 0 1.1cqw rgba(92,236,226,.65),inset 0 0 .9cqw rgba(92,236,226,.3)}
.word.r>span:before{content:"";position:absolute;left:.5cqw;top:.24cqw;width:.3cqw;height:.3cqw;border-radius:50%;background:#fff;box-shadow:.5cqw 0 #fff,1cqw 0 #fff;opacity:.9}
.word.r b{display:block;font:700 2.3cqw/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#eafffd;
  text-shadow:0 0 .25em rgb(var(--teal)),0 0 .7em rgb(var(--teal)),0 0 1.5em rgba(var(--teal),.7)}
.word.r b:after{content:"_";animation:caret 1s steps(2,jump-none) infinite}
@keyframes caret{from{opacity:0}to{opacity:1}}
.word.r:hover>span,.word.r:focus-visible>span,.hr .word.r>span{filter:brightness(1.2);box-shadow:0 0 2cqw rgba(92,236,226,.95),inset 0 0 1.1cqw rgba(92,236,226,.45)}
/* title */
.title{position:absolute;left:0;right:0;top:max(2.4vh,calc(env(safe-area-inset-top) + 10px));z-index:4;text-align:center;pointer-events:none}
.title:before{content:"";position:absolute;left:50%;top:-40%;width:min(92vw,150vh);height:230%;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(var(--halo),.5),rgba(var(--halo),.28) 45%,transparent 72%);z-index:-1}
h1{font:800 min(7.4vw,11.2vh)/1 Fraunces,Georgia,serif;letter-spacing:-.005em;white-space:nowrap;
  background:linear-gradient(var(--ink2),var(--ink) 62%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 var(--edge,rgba(255,255,255,.55))) drop-shadow(0 0 18px rgba(var(--halo),.75))}
.hint{margin-top:.55em;font:700 clamp(10px,1vw,15px)/1 Cinzel,serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 10px rgba(var(--halo),.9)}
.contact{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:4;text-align:right;font:700 12.5px/1 Cinzel,serif;letter-spacing:.05em;color:#fff;text-shadow:0 1px 5px #1c0b22,0 0 12px #1c0b22,0 0 2px #1c0b22;pointer-events:none}
.contact a{text-decoration:underline;text-underline-offset:3px;pointer-events:auto}
/* phone layout: the painting is far wider than a phone, so hold the camera on the rock and put the two choices in a
   dock below it. Used whenever the window is narrower than 3:2 (below that the floating words no longer fit on screen).
   The same test lives in narrow() in the script. */
.dock{display:none}
@media (max-aspect-ratio:3/2){
  h1{font-size:min(11.6vw,13vh)}
  .stage{--lift:-3svh}
  .signs,.way,.dim,.title .hint{display:none}
  .dock{display:block;position:absolute;left:0;right:0;bottom:0;z-index:4;text-align:center;
    padding:clamp(56px,11vh,110px) max(16px,env(safe-area-inset-right)) calc(max(10px,env(safe-area-inset-bottom)) + 34px) max(16px,env(safe-area-inset-left));
    background:linear-gradient(rgba(27,16,36,0),rgba(27,16,36,.82) 34%,#1b1024 62%)}
  .dock .hint{margin:0 0 14px;font-size:11.5px}
  .picks{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px}
  .pick{flex:1 1 132px;max-width:210px;min-height:60px;display:flex;align-items:center;justify-content:center;border-radius:8px;outline-offset:3px;
    -webkit-tap-highlight-color:transparent;transition:transform .2s,filter .2s}
  .pick:active,.pick.on{transform:scale(.97);filter:brightness(1.25)}
  .pick.l{flex-direction:column;gap:6px;padding:8px 10px;border:1.5px solid #f0b548;background:linear-gradient(#4a1226,#2c0a1c);
    box-shadow:0 0 16px rgba(255,190,80,.45),inset 0 0 14px rgba(255,180,70,.18)}
  .pick.l b{font:900 clamp(19px,5.6vw,24px)/1 Cinzel,serif;letter-spacing:.1em;text-indent:.1em;text-transform:uppercase;
    background:linear-gradient(#fffbe0 8%,#ffd76a 42%,#f0a22e 64%,#b9661a 92%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pick.l i{align-self:stretch;height:5px;background:radial-gradient(circle,#fff6cf 0 28%,#ffc04a 34% 46%,transparent 52%) 0 50%/11px 100% space;
    filter:drop-shadow(0 0 3px rgba(255,196,92,.95));animation:bulbs 1.1s steps(2,jump-none) infinite}
  .pick.l i:first-child{animation-delay:-.55s}
  .pick.r{position:relative;padding:17px 10px 7px;border:1.5px solid rgba(150,255,246,.9);
    background:linear-gradient(rgba(120,250,240,.5) 0 11px,rgba(40,170,170,.2) 11px),repeating-linear-gradient(0deg,rgba(160,255,248,.1) 0 2px,transparent 2px 4px);
    box-shadow:0 0 16px rgba(92,236,226,.6),inset 0 0 12px rgba(92,236,226,.3)}
  .pick.r:before{content:"";position:absolute;left:7px;top:3.5px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:7px 0 #fff,14px 0 #fff;opacity:.9}
  .pick.r b{font:700 clamp(15px,4.4vw,19px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#eafffd;
    text-shadow:0 0 .25em rgb(var(--teal)),0 0 .7em rgb(var(--teal)),0 0 1.5em rgba(var(--teal),.7)}
  .pick.r b:after{content:"_";animation:caret 1s steps(2,jump-none) infinite}
  .contact{left:50%;right:auto;translate:-50% 0;white-space:nowrap;font-size:10.5px;bottom:max(10px,env(safe-area-inset-bottom));text-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="scene" id="scene">
  <div class="stage" id="stage">
    <img id="art" alt="">
    <canvas id="gl"></canvas>
    <div class="fx" id="fx">
      <div class="lay far" id="far"><canvas id="farc"></canvas></div>
      <div class="lay mid" id="mid"></div>
      <span class="dim l"></span><span class="dim r"></span>
      <span class="bloom l"></span><span class="bloom r"></span>
      <span class="beam a"></span><span class="beam b"></span>
      <svg class="trail" preserveAspectRatio="none" aria-hidden="true">
        <path class="glow l" pathLength="1"/><path class="core l" pathLength="1"/>
        <path class="glow r" pathLength="1"/><path class="core r" pathLength="1"/>
      </svg>
      <canvas id="motes"></canvas>
      <div class="lay near" id="near"></div>
    </div>
    <a class="way l" href="/acting/" data-side="l" aria-label="Acting"></a>
    <a class="way r" href="/websites/" data-side="r" aria-label="Websites"></a>
    <div class="signs">
      <a class="word l" href="/acting/" data-side="l"><span><i></i><b>Acting</b><i></i></span></a>
      <a class="word r" href="/websites/" data-side="r"><span><b>Websites</b></span></a>
    </div>
  </div>
  <div class="title"><h1>Harrison Keen</h1><p class="hint">Choose your path</p></div>
  <nav class="dock" aria-label="Pick your path">
    <p class="hint">Pick your path</p>
    <div class="picks">
      <a class="pick l" href="/acting/" data-side="l"><i></i><b>Acting</b><i></i></a>
      <a class="pick r" href="/websites/" data-side="r"><b>Websites</b></a>
    </div>
  </nav>
  <p class="contact"><a href="https://www.instagram.com/harrison.keen/">Instagram</a> &nbsp;·&nbsp; keen_ha@outlook.com</p>
  <span class="dawn"></span><span class="flash"></span>
</div>

<script>
(function(){
  var name='isles';
  var C=WORLDS[name],A='/assets/home/'+name;
  var scene=document.getElementById('scene'),stage=document.getElementById('stage'),img=document.getElementById('art'),fx=document.getElementById('fx');
  var IW=C.size[0],IH=C.size[1];
  var PADY=C.pad||0;function P(p){return [p[0]/IW*100,(p[1]+PADY)/IH*100]}                 /* painting px -> % of stage */
  function PP(a){return a.map(P)}
  var $=function(s){return document.querySelector(s)},$$=function(s){return [].slice.call(document.querySelectorAll(s))};
  stage.style.setProperty('--ratio',(IW/IH).toFixed(4));
  if(C.css)for(var k in C.css)scene.style.setProperty(k,C.css[k]);
  if(C.font)$('h1').style.fontFamily=C.font;
  if(C.cls)scene.classList.add(C.cls);
  img.src=A+'.jpg';img.alt=C.alt||'';
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var MQ=matchMedia('(max-aspect-ratio:3/2)'),narrow=function(){return MQ.matches};          /* phone layout, same test as the CSS */
  var R=Math.random,TAU=6.2832;
  function rnd(a,b){return a+R()*(b-a)}
  function place(el,r){var a=P([r[0],r[1]]),b=P([r[2],r[3]]);el.style.left=a[0]+'%';el.style.top=a[1]+'%';el.style.width=(b[0]-a[0])+'%';el.style.height=(b[1]-a[1])+'%';if(r[4])el.style.rotate=r[4]+'deg'}

  /* layout from the world file */
  var END={l:P(C.end.l),r:P(C.end.r)};
  ['l','r'].forEach(function(k){var b=$('.bloom.'+k);b.style.left=END[k][0]+'%';b.style.top=END[k][1]+'%';place($('.way.'+k),C.way[k])});

  /* trails */
  function smooth(p){var o=[];for(var i=0;i<p.length-1;i++){var a=p[Math.max(i-1,0)],b=p[i],c=p[i+1],d=p[Math.min(i+2,p.length-1)];
    for(var t=0;t<1;t+=.1){var t2=t*t,t3=t2*t;o.push([.5*((2*b[0])+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),.5*((2*b[1])+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3)])}}
    o.push(p[p.length-1]);return o}
  var S={l:smooth(PP(C.trail.l)),r:smooth(PP(C.trail.r))};
  $('svg.trail').setAttribute('viewBox','0 0 100 '+(100*IH/IW).toFixed(2));
  ['l','r'].forEach(function(k){var d=S[k].map(function(p,i){return (i?'L':'M')+p[0].toFixed(2)+' '+(p[1]*IH/IW).toFixed(2)}).join(' ');
    $$('.trail .'+k).forEach(function(el){el.setAttribute('d',d)})});

  /* which way are we looking */
  var side=null,leaving=false,zooming=false;
  function look(k){if(leaving||k===side)return;side=k;scene.classList.toggle('hl',k==='l');scene.classList.toggle('hr',k==='r');
    $$('.dock a').forEach(function(a){a.classList.toggle('on',a.dataset.side===k)})}
  $$('.way,.word').forEach(function(a){
    a.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')look(a.dataset.side)});
    a.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')look(null)});
    a.addEventListener('focus',function(){look(a.dataset.side)});a.addEventListener('blur',function(){look(null)});
  });
  $$('.way,.word,.dock a').forEach(function(a){a.addEventListener('click',function(e){
    if(still)return;e.preventDefault();if(leaving)return;var k=a.dataset.side,n=narrow();look(k);leaving=true;
    panT=0;
    /* desktop: walk in toward the building. Phone layout: the buildings are off screen, so push in gently on the rock
       and let the glow spread from the button that was tapped. */
    setTimeout(function(){stage.style.setProperty('--ox',n?'50%':END[k][0]+'%');stage.style.setProperty('--oy',n?'52%':(END[k][1]+3)+'%');
      var fl=$('.flash'),sr=scene.getBoundingClientRect(),br=(n?a:$('.bloom.'+k)).getBoundingClientRect(),fx_=br.left+br.width/2-sr.left,fy_=br.top+br.height/2-sr.top;
      fl.style.setProperty('--fx',fx_.toFixed(0)+'px');fl.style.setProperty('--fy',fy_.toFixed(0)+'px');
      zooming=true;stage.classList.add('walk');stage.style.setProperty('--zoom',n?'1.3':'2.6');scene.classList.add('go-'+k)},30);
    setTimeout(function(){top.location.href=a.href},1030);
  })});
  addEventListener('pageshow',function(e){if(e.persisted)location.reload()});

  /* camera + cursor (cursor is kept in % of the painting so the cast can react to it) */
  var mx=0,my=0,cx=0,cy=0,pan=0,panT=0,t0=performance.now(),cur=null;
  function panFor(k){var w=stage.offsetWidth,max=Math.max(0,(w-innerWidth)/2);return Math.max(-max,Math.min(max,(50-END[k][0])/100*w))}
  if(matchMedia('(pointer:fine)').matches){
