<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Harrison Keen — Actor. Film, TV, and stage credits. Vancouver based. Internationally cast.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Harrison Keen — Actor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300..600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--night:#0b0b0b;--paper:#f3f4f5;--white:#f6f6f4;--silver:#a3a6aa;--graphite:#55585c;--acc:#f6f6f4;--acc-ink:#0b0b0b;
  --G:clamp(16px,4.5vw,64px);--serif:"Bodoni Moda",Didot,serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--cond:"Antonio","Arial Narrow",sans-serif;--ease:cubic-bezier(.2,.7,.1,1)}
[data-accent=amber]{--acc:#f2b24c;--acc-ink:#8a5200}
[data-accent=red]{--acc:#ef4f55;--acc-ink:#b21f2b}
[data-accent=blue]{--acc:#7aa7ff;--acc-ink:#1c49c9}
[data-accent=jade]{--acc:#57d3a6;--acc-ink:#0a7350}
[data-accent=champagne]{--acc:#e8d3a2;--acc-ink:#7a5c14}
[data-accent=brass]{--acc:#d4a437;--acc-ink:#7c5a00}
[data-accent=copper]{--acc:#e98b5a;--acc-ink:#a4441a}
[data-accent=rose]{--acc:#f29bb0;--acc-ink:#b02a55}
[data-accent=ice]{--acc:#8fd6ea;--acc-ink:#0b6e8a}
[data-accent=violet]{--acc:#b7a0ff;--acc-ink:#5a34c9}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--night)}
html,body{overflow-x:clip}
body{color:var(--white);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
*{font-variation-settings:'opsz' 14 !important}
.name,.sec-title,.sign{font-variation-settings:'opsz' 9 !important}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--a,currentColor);outline-offset:3px}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding:0 var(--G)}
.lab{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* the depth background: one fixed canvas behind the whole page; see-through sections reveal it */
.void{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}

/* ---------- menu: only after the hero ---------- */
.nav{--a:var(--acc);position:fixed;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px var(--G);background:rgba(11,11,11,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--white);
  border-bottom:1px solid rgba(255,255,255,.14);transform:translateY(-101%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s}
.nav.on{transform:none;visibility:visible;transition:transform .35s var(--ease)}
.nav-name{font:600 20px/1 var(--serif);letter-spacing:-.01em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.nav nav{display:flex;gap:clamp(12px,2.2vw,32px)}
.nav nav a{text-decoration:none;font-size:12.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
.nav nav a:hover{border-bottom-color:var(--a);color:var(--a)}
.nav nav a.home{color:var(--a)}
.nav nav a.cur{border-bottom-color:var(--a)}

/* ---------- hero: the cover ---------- */
.hero{position:relative;height:var(--screen,100svh);min-height:560px;overflow:hidden;background:linear-gradient(#0c0c0c,#050505);isolation:isolate;--mute:var(--silver)}
.hp{position:absolute;z-index:1;aspect-ratio:900/1371;transform-origin:56% 30%;
  --fade:linear-gradient(to right,transparent,#000 22%,#000 80%,transparent),linear-gradient(to bottom,#000 68%,transparent);
  -webkit-mask-image:var(--fade);mask-image:var(--fade);-webkit-mask-composite:source-in;mask-composite:intersect}
.hp img{width:100%;height:100%}
.hp.cut{z-index:3;pointer-events:none}
.name{position:absolute;z-index:2;left:var(--G);right:var(--G);top:24px;
  font:700 100px/.8 var(--serif);letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
.name .fit{display:inline-block}
.name .line{display:inline-block;overflow:hidden;padding:.04em 0 .02em;vertical-align:top}
.name .line>span{display:inline-block}
.name.stack .line{display:block}
.name.stack .line+.line{margin-top:-.02em}
.hline{position:absolute;z-index:4;left:var(--G);bottom:clamp(24px,calc(var(--screen,100svh)*.055),52px);display:grid;gap:7px}
.hline b{font:italic 500 26px/1.1 var(--serif)}
.a-hero{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}
/* these atmospheres sit behind him: over the backdrop and the name, under the cut-out figure */
:is([data-atm=paps],[data-atm=stars],[data-atm=aurora],[data-atm=caustic],[data-atm=threads]) .a-hero{z-index:2}
/* foil glint: a band of the accent crosses the name every few seconds */
[data-atm=sheen] .name .line>span{background:linear-gradient(105deg,var(--white) 43%,var(--acc) 48%,#fff 50%,var(--acc) 52%,var(--white) 57%) 100% 0/300% 100% no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes sheen{0%{background-position:100% 0}40%,100%{background-position:0 0}}
@media (prefers-reduced-motion:no-preference){
  .hero .hline{animation:fade .9s 1.2s both}
  .hero .line>span{animation:rise 1.1s var(--ease) both}
  .hero .line+.line>span{animation-delay:.12s}
  .hero .hp{animation:settle 2.2s var(--ease) both}
  .hero .a-hero{animation:fade 3s 1.8s both}
  [data-atm=sheen] .hero .line>span{animation:rise 1.1s var(--ease) both,sheen 7s 2.2s infinite}
  [data-atm=sheen] .hero .line+.line>span{animation-delay:.12s,2.7s}
}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes settle{from{transform:scale(1.06);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- sections ---------- */
main>section,.contact{--bg:var(--night);--fg:var(--white);--mute:var(--silver);--line:rgba(255,255,255,.2);--a:var(--acc);--on-a:var(--night);
  background:var(--bg);color:var(--fg);padding:clamp(64px,9vw,128px) 0;scroll-margin-top:52px;position:relative}
main>section.on-paper{--bg:var(--paper);--fg:var(--night);--mute:var(--graphite);--line:rgba(0,0,0,.18);--a:var(--acc-ink);--on-a:#fff}
[data-depth=A] :is(#photos,#socials,#contact),[data-depth=B] :is(#press,#photos,#socials,#contact){background:transparent}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px 32px;margin-bottom:clamp(28px,4vw,52px);
  padding-bottom:clamp(18px,2.4vw,30px);border-bottom:1px solid var(--line)}
.sec-title{font:600 clamp(44px,7vw,104px)/.9 var(--serif);letter-spacing:-.02em}
.tlink{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding-bottom:4px;border-bottom:2px solid var(--a);cursor:pointer;transition:color .2s}
.tlink:hover{color:var(--a)}
.it{font:italic 500 23px/1.2 var(--serif)}

/* ----- featured work: three posters ----- */
.fw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.8vw,44px);align-items:start}
.fw figcaption{margin-top:14px;text-align:center}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:#000;color:#fff;container-type:inline-size;box-shadow:0 30px 50px -30px rgba(0,0,0,.55)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster h3{font:700 13cqw/.88 var(--serif);letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.poster h3.one{white-space:nowrap;margin:0 -7cqw}
.p-top{position:absolute;z-index:1;top:6cqw;left:0;right:0;text-align:center;font:500 2.5cqw/1.3 var(--sans);letter-spacing:.34em;text-transform:uppercase}
.p-bot{position:absolute;z-index:1;left:7cqw;right:7cqw;bottom:6cqw;text-align:center}
.p-star{display:block;font:500 3.7cqw/1 var(--sans);letter-spacing:.42em;text-transform:uppercase;margin-bottom:3cqw}
.p-role{font:italic 500 4.6cqw/1.2 var(--serif);margin-top:2.6cqw}
.bill{font:400 2.7cqw/1.5 var(--cond);letter-spacing:.09em;text-transform:uppercase;opacity:.72;margin-top:4cqw}
.p-v{display:none}
/* A one-sheet: full-bleed still, title low */
.fw-A .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 22%,transparent 42%,rgba(0,0,0,.92) 84%)}
/* B foyer: printed poster with a paper margin, hung in a lit display case */
.fw-B .case{background:#141414;padding:5.5%;box-shadow:inset 0 0 0 1px #3a3a3a,inset 0 14px 30px -10px rgba(255,255,255,.22),0 34px 50px -30px rgba(0,0,0,.6)}
.fw-B .poster{background:#f4f1ea;color:#111;box-shadow:none}
.fw-B .poster img{inset:auto;left:5cqw;top:5cqw;width:90cqw;height:62%}
.fw-B .p-top{display:none}
.fw-B .p-bot{text-align:left;left:5cqw;right:5cqw;bottom:5cqw}
.fw-B .poster h3{font-size:11.5cqw}
.fw-B .p-star{letter-spacing:.3em;font-size:3.1cqw;margin-bottom:2.2cqw}
.fw-B .bill{margin-top:2.6cqw;font-size:2.4cqw}
.fw-B .p-role{margin-top:1.6cqw;font-size:4.2cqw}
/* C festival: black-and-white still, title up the side in the accent */
.fw-C .poster img{filter:grayscale(1) contrast(1.12) brightness(.82)}
.fw-C .poster::after{content:"";position:absolute;inset:3.5cqw;border:1px solid rgba(255,255,255,.55)}
.fw-C .p-v{display:block;position:absolute;z-index:1;left:6.5cqw;bottom:7cqw;top:7cqw;writing-mode:vertical-rl;transform:rotate(180deg);
  font:600 12.5cqw/.9 var(--cond);letter-spacing:0;text-transform:uppercase;color:var(--acc);white-space:nowrap;overflow:hidden}
.fw-C .p-top{left:auto;right:8cqw;top:8cqw;text-align:right;letter-spacing:.24em}
.fw-C .p-bot{left:auto;right:9cqw;bottom:8cqw;text-align:right;width:52cqw}
.fw-C .p-bot h3,.fw-C .bill{display:none}

/* ----- press: scroll timeline ----- */
.tl-wrap{position:relative;max-width:1100px;margin:0 auto}
.tl{list-style:none;padding:0;position:relative}
.tl::before,.tl-spine{content:"";position:absolute;left:50%;top:10px;width:2px;margin-left:-1px}
.tl::before{bottom:10px;background:var(--line)}
.tl-spine{height:0;background:var(--a);z-index:1}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:start;margin-bottom:clamp(28px,3.6vw,52px)}
.tl li:last-child{margin-bottom:0}
.tl-dot{grid-column:2;grid-row:1;justify-self:center;position:relative;z-index:2;width:13px;height:13px;border-radius:50%;margin-top:9px;background:var(--night);border:2px solid var(--silver)}
.tl li.art .tl-dot{background:var(--a);border-color:var(--a);box-shadow:0 0 0 5px rgba(11,11,11,.9)}
.tl-y{grid-row:1;font:italic 500 clamp(22px,2.5vw,34px)/1.2 var(--serif)}
.tl-b{grid-row:1}
.tl li:nth-child(odd) .tl-b{grid-column:1;text-align:right}.tl li:nth-child(odd) .tl-y{grid-column:3}
.tl li:nth-child(even) .tl-b{grid-column:3}.tl li:nth-child(even) .tl-y{grid-column:1;text-align:right}
.tl-n{font-size:18px;line-height:1.5;color:var(--mute);max-width:42ch;padding-top:4px;display:inline-block;text-align:inherit}
.card{display:block;text-align:left;text-decoration:none;border:1px solid var(--line);background:rgba(20,20,20,.72);padding:clamp(18px,2.2vw,30px);transition:border-color .25s,transform .35s var(--ease)}
.card:hover{border-color:var(--a);transform:translateY(-3px)}
.out{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.card h3{font:italic 500 clamp(23px,2.5vw,34px)/1.14 var(--serif);margin:14px 0 10px}
.card blockquote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--a);font:italic 400 18px/1.4 var(--serif)}
.card p{font-size:15.5px;color:var(--mute)}
.go{display:inline-block;margin-top:16px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--a);padding-bottom:3px}
.js .tl li{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s var(--ease)}
.js .tl li.in{opacity:1;transform:none}

/* ----- reels ----- */
.stage{background:#000;aspect-ratio:16/9;max-height:calc(var(--screen,100svh) - 150px);margin:0 auto;width:100%}
.stage video{width:100%;height:100%;object-fit:contain;background:#000}
.clip{text-align:left;display:block}
.clip .th{position:relative;display:block;background:#000;overflow:hidden}
.clip img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease),opacity .3s}
.clip:hover img{transform:scale(1.04)}
.clip b{font:italic 500 20px/1.15 var(--serif)}
.clip i{font-style:normal;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.play{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:var(--a);display:grid;place-items:center;transition:transform .3s var(--ease)}
.play::after{content:"";margin-left:3px;border-left:13px solid var(--on-a);border-top:8px solid transparent;border-bottom:8px solid transparent}
.clip:hover .play{transform:scale(1.12)}
/* A wall: every clip at its true shape, rows flush; plays in a theatre overlay */
.rw-row{display:flex;align-items:flex-start;gap:clamp(8px,1.2vw,18px);margin-bottom:clamp(20px,2.4vw,32px)}
.rw-row .clip{flex:var(--ar) 1 0;min-width:0}
.rw-row .th{aspect-ratio:var(--ar)}
.rw-row .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.rw-row.lead b{font-size:clamp(24px,2.6vw,36px)}
.theatre{position:fixed;inset:0;z-index:80;background:rgba(5,5,5,.96);display:grid;place-items:center;padding:56px clamp(12px,4vw,64px) 24px}
.theatre .stage{max-width:1280px;max-height:calc(100svh - 120px)}
.theatre .x{position:absolute;top:max(10px,env(safe-area-inset-top));right:14px;font-size:44px;line-height:1;padding:10px;color:#fff}
.theatre p{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff}
/* B titles: one screen, the programme in words */
.titles{display:flex;flex-wrap:wrap;gap:6px clamp(18px,2.6vw,40px);margin-top:clamp(22px,3vw,40px)}
.titles .clip{color:var(--mute);padding:6px 0;border-bottom:2px solid transparent;transition:color .2s}
.titles .clip b{font-size:clamp(24px,3.2vw,46px)}
.titles .clip i{margin-left:8px;vertical-align:super}
.titles .clip:hover,.titles .clip.is-on{color:var(--fg)}
.titles .clip.is-on{border-bottom-color:var(--a)}
/* C carousel: one at a time */
.car-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(14px,2vw,28px);align-items:center;margin-top:clamp(16px,2vw,26px)}
.car-bar>button{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;font-size:22px;line-height:1;transition:background .2s,color .2s,border-color .2s}
.car-bar>button:hover{background:var(--a);border-color:var(--a);color:var(--on-a)}
.car-now{text-align:center}
.car-now b{display:block;font:italic 500 clamp(26px,3.4vw,48px)/1.1 var(--serif)}
.car-now span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.dots{display:flex;justify-content:center;gap:8px;margin-top:16px}
.dots .clip{width:34px;height:14px;position:relative}
.dots .clip::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line)}
.dots .clip.is-on::after{background:var(--a);height:4px;top:5px}
/* D programme: screen left, list right */
.rv-D{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(260px,1fr);gap:clamp(20px,3vw,48px);align-items:center}
.prog .clip{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:14px;padding:clamp(10px,1.2vw,16px) 0 clamp(10px,1.2vw,16px) 0;border-top:1px solid var(--line);transition:padding .3s var(--ease)}
.prog .clip:last-child{border-bottom:1px solid var(--line)}
.prog .clip b{font-size:clamp(22px,2.1vw,30px)}
.prog .clip.is-on{padding-left:18px;box-shadow:inset 4px 0 0 var(--a)}
.prog .clip:hover b{color:var(--a)}

/* ----- photos: natural shapes, every row flush ----- */
.ph-row{display:flex;gap:clamp(6px,.8vw,12px);margin-bottom:clamp(6px,.8vw,12px)}
.ph-row:last-child{margin-bottom:0}
.ph-row img{flex:var(--ar) 1 0;min-width:0;aspect-ratio:var(--ar);object-fit:cover;cursor:zoom-in;transition:opacity .3s}
.ph-row img:hover{opacity:.8}

/* ----- credits ----- */
.credits{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:0 clamp(28px,4vw,64px);align-items:start}
.cr-h{font:italic 500 23px/1.2 var(--serif);margin:34px 0 10px}
.cr-col>.cr-keep:first-child .cr-h{margin-top:0}
.cr{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 10px;padding:calc(9px + var(--x,0px)) 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.cr-y{color:var(--mute);font-variant-numeric:tabular-nums}
.cr-t{font-weight:600}
.cr-r{grid-column:2;color:var(--mute)}
/* B playbill: title ..... role */
.credits.pb .cr-h{text-align:center;font-size:15px;font-style:normal;font-family:var(--sans);font-weight:600;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.credits.pb .cr-h::before,.credits.pb .cr-h::after{content:"";flex:1;height:1px;background:var(--fg)}
.credits.pb .cr{display:flex;align-items:baseline;gap:8px;border:0;padding:6px 0}
.credits.pb .cr-t{font:italic 500 18px/1.25 var(--serif);max-width:62%}
.credits.pb .dotl{flex:1;min-width:16px;border-bottom:1px dotted var(--mute);transform:translateY(-4px)}
.credits.pb .cr-r{text-align:right;max-width:46%;font-size:14px}
/* C call sheet: header bars */
.credits.cs .cr-h{font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:10px 12px;display:flex;justify-content:space-between;margin-bottom:0}
.credits.cs .cr{padding:9px 12px;border-top:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);grid-template-columns:62px minmax(0,1fr)}
.credits.cs .cr-c{grid-column:2;font-size:13px;color:var(--mute)}
/* D by year */
.credits.yr .cr-h{font:600 clamp(44px,5vw,72px)/.9 var(--serif);font-style:normal;letter-spacing:-.02em;color:var(--a);margin-bottom:14px}
.credits.yr .cr{grid-template-columns:74px minmax(0,1fr)}
.credits.yr .cr-y{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding-top:3px}
/* E with companies: one line per credit */
.credits.co .cr{grid-template-columns:54px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.credits.co .cr-r,.credits.co .cr-c{grid-column:auto;color:var(--mute);font-size:14px}

/* ----- socials ----- */
/* A tickets */
.so-A{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.6vw,40px)}
.tk{display:grid;grid-template-columns:minmax(0,1fr) 96px;text-decoration:none;background:var(--white);color:var(--night);min-height:190px;transition:transform .35s var(--ease);
  --n:radial-gradient(circle 12px at calc(100% - 96px) 0,transparent 96%,#000),radial-gradient(circle 12px at calc(100% - 96px) 100%,transparent 96%,#000);
  -webkit-mask-image:var(--n);mask-image:var(--n);-webkit-mask-composite:source-in;mask-composite:intersect}
.tk:hover{transform:translateY(-4px) rotate(-.6deg)}
.tk>div{padding:clamp(20px,2.4vw,34px);display:flex;flex-direction:column;justify-content:space-between}
.tk .lab{color:var(--graphite)}
